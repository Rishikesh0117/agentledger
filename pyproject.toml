[project]
name = "agentledger"
version = "0.1.0"
description = "Accountability layer for AI agents: traced actions, policy checks, guardian review, human approval, hash-chained audit log."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentledger*"]
